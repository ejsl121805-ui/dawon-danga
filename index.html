<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다원트레이드 통합 단가 대시보드</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#14202e;
  --paper:#f7f5f0;
  --line:#dcd6ca;
  --sub:#6b6558;
  --up:#c0392b;
  --down:#1f6e5a;
  --flat:#8a8375;
  --accent:#c8892a;
  --soft:#efece4;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
  background:var(--paper);
  color:var(--ink);
  line-height:1.5
}
button,input,textarea,select{font-family:inherit;color:var(--ink)}
button{cursor:pointer}
header{
  background:var(--ink);
  color:#fff;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  flex-wrap:wrap;
  gap:12px
}
.eyebrow{
  font-size:11px;
  letter-spacing:3px;
  color:var(--accent);
  font-weight:700
}
header h1{font-size:22px;margin-top:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tb{
  padding:8px 14px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,.25);
  font-size:13px;
  font-weight:600;
  background:transparent;
  color:var(--paper)
}
.tb.on{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent)
}
.vbar{
  display:flex;
  gap:6px;
  align-items:center;
  padding:12px 20px;
  background:var(--soft);
  border-bottom:1px solid var(--line);
  flex-wrap:wrap
}
.chip{
  padding:6px 12px;
  border-radius:20px;
  border:1px solid var(--line);
  font-size:13px;
  font-weight:600;
  background:#fff
}
.chip.on{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink)
}
.wrap{
  padding:0 20px 60px;
  max-width:1200px;
  margin:0 auto
}
.st{margin:22px 0 18px}
.st .ey{
  font-size:11px;
  letter-spacing:2px;
  color:var(--accent);
  font-weight:700
}
.st h2{font-size:22px;margin:4px 0 6px}
.st p{font-size:13px;color:var(--sub)}
.bp{
  background:var(--accent);
  color:#fff;
  border:none;
  padding:10px 18px;
  border-radius:8px;
  font-size:14px;
  font-weight:700
}
.bg{
  background:#fff;
  border:1px solid var(--line);
  padding:9px 14px;
  border-radius:8px;
  font-size:13px;
  font-weight:600
}
.bgs{
  background:#fff;
  border:1px solid var(--line);
  padding:6px 12px;
  border-radius:6px;
  font-size:12px;
  font-weight:600
}
.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:16px
}
.dashboard-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(130px,1fr));
  gap:10px;
  margin-bottom:22px
}
.metric-label{font-size:12px;color:var(--sub)}
.metric-value{
  font-size:27px;
  font-weight:800;
  letter-spacing:-1px;
  margin-top:4px
}
.metric-sub{font-size:11px;color:var(--sub);margin-top:4px}
.section{margin-top:22px}
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:12px;
  margin-bottom:10px;
  flex-wrap:wrap
}
.section-title{font-size:16px;font-weight:800}
.section-desc{font-size:12px;color:var(--sub);margin-top:3px}
.two-column{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}
.ranking-item{
  display:grid;
  grid-template-columns:34px minmax(120px,1fr) auto;
  align-items:center;
  gap:8px;
  padding:9px 2px;
  border-bottom:1px solid #eee9df
}
.ranking-item:last-child{border-bottom:none}
.ranking-number{
  width:28px;
  height:28px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--soft);
  font-size:12px;
  font-weight:800
}
.ranking-model{font-size:13px;font-weight:700}
.ranking-grade{font-size:11px;color:var(--sub);margin-top:2px}
.ranking-amount{text-align:right;font-size:13px;font-weight:800}
.ranking-pct{font-size:11px;margin-top:2px}
.up{color:var(--up)}
.down{color:var(--down)}
.flat{color:var(--flat)}
.empty{
  padding:35px 20px;
  text-align:center;
  color:var(--sub);
  font-size:13px;
  background:#fff;
  border:1px dashed var(--line);
  border-radius:10px
}
.control-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center
}
.control-row label{
  font-size:12px;
  color:var(--sub);
  font-weight:600
}
.control-row select,
.control-row input[type="date"]{
  padding:8px 11px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff
}
.notice{
  background:#fff8e8;
  border:1px solid #ead4a2;
  color:#785100;
  padding:10px 12px;
  border-radius:9px;
  font-size:12px;
  margin-bottom:12px
}
.comment-box{
  background:var(--ink);
  color:#f7f5f0;
  border-radius:12px;
  padding:18px
}
.comment-box h3{
  font-size:15px;
  color:var(--accent);
  margin-bottom:10px
}
.comment-box ul{padding-left:19px}
.comment-box li{font-size:13px;margin-bottom:8px}
table{
  border-collapse:collapse;
  width:100%;
  background:#fff;
  font-size:13px
}
th{
  background:var(--ink);
  color:#fff;
  padding:10px 8px;
  font-size:12px;
  text-align:center
}
td{
  border-bottom:1px solid var(--line);
  border-right:1px solid #f0ece3;
  padding:7px 8px
}
.tblwrap{
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:10px
}
.ci{
  width:100%;
  border:1px solid transparent;
  background:transparent;
  padding:6px 4px;
  outline:none;
  border-radius:4px
}
.ci:focus{
  border-color:var(--accent);
  background:#fffdf8
}
.status-badge{
  display:inline-block;
  padding:3px 8px;
  border-radius:12px;
  background:var(--soft);
  font-size:11px;
  font-weight:700
}
.gap-positive{color:var(--up);font-weight:800}
.gap-negative{color:var(--down);font-weight:800}
.gap-zero{color:var(--flat);font-weight:800}
.vendor-status{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:10px
}
.vendor-status small{
  display:block;
  color:var(--sub);
  margin-top:4px
}
.toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  background:var(--ink);
  color:#fff;
  padding:12px 22px;
  border-radius:10px;
  z-index:100
}
@media(max-width:920px){
  .dashboard-grid{grid-template-columns:repeat(2,1fr)}
  .two-column{grid-template-columns:1fr}
}
@media(max-width:600px){
  .wrap{padding-left:12px;padding-right:12px}
  .dashboard-grid{grid-template-columns:1fr 1fr}
  .metric-value{font-size:22px}
  .tb{padding:7px 10px;font-size:12px}
}
</style>
</head>

<body>
<div id="app"></div>

<!-- 엑셀 업로드용 라이브러리 -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
(function(){
"use strict";

var A=document.getElementById("app");

var LS={
  get:function(key){
    try{
      return JSON.parse(localStorage.getItem("dw_"+key));
    }catch(error){
      return null;
    }
  },
  set:function(key,value){
    try{
      localStorage.setItem("dw_"+key,JSON.stringify(value));
    }catch(error){
      console.error("저장 실패",error);
    }
  }
};

function esc(value){
  return String(value==null?"":value).replace(/[&<>"]/g,function(c){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;"
    }[c];
  });
}

function won(value){
  if(value===""||value==null||isNaN(value)) return "-";
  return Number(value).toLocaleString("ko-KR");
}

function signedWon(value){
  if(value==null||isNaN(value)) return "-";
  if(value>0) return "+"+won(value)+"원";
  if(value<0) return "-"+won(Math.abs(value))+"원";
  return "0원";
}

function todayISO(){
  var d=new Date();
  return d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0");
}

function weekLabel(dateString){
  if(!dateString) return "";

  var date=new Date(dateString+"T00:00:00");
  var first=new Date(date.getFullYear(),0,1);

  var week=Math.ceil(
    (
      (date-first)/86400000+
      first.getDay()+1
    )/7
  );

  return date.getFullYear()+"년 "+
    (date.getMonth()+1)+"월 "+
    week+"주차";
}

function emptyRow(columns){
  var row={model:""};

  columns.forEach(function(grade){
    row[grade]="";
  });

  return row;
}

function defaultVendors(){
  return [
    {
      id:"dawon",
      name:"다원(자체)",
      grades:["A급","A-급","B+급","B급","액파","LCD"]
    },
    {
      id:"jinwoo",
      name:"진우아이엔씨",
      grades:["A급","A-급","B+급","B급","액정파손","LCD"]
    }
  ];
}

function modelKey(model){
  return String(model||"")
    .toLowerCase()
    .replace(/\s+/g,"")
    .replace(/[_-]/g,"");
}

function gradeKey(grade){
  var key=String(grade||"")
    .toUpperCase()
    .replace(/\s+/g,"")
    .replace(/급/g,"");

  if(
    key==="액정파손"||
    key==="액정파손품"||
    key==="액파"
  ){
    return "액파";
  }

  return key;
}

function numberValue(value){
  if(value===""||value==null) return null;

  var number=Number(value);

  return isNaN(number)?null:number;
}

function toast(message){
  var old=document.querySelector(".toast");

  if(old) old.remove();

  var element=document.createElement("div");
  element.className="toast";
  element.textContent=message;

  document.body.appendChild(element);

  setTimeout(function(){
    element.remove();
  },3000);
}

function sectionTitle(eyebrow,title,description){
  return `
    <div class="st">
      <div class="ey">${esc(eyebrow)}</div>
      <h2>${esc(title)}</h2>
      <p>${esc(description)}</p>
    </div>
  `;
}

function metricCard(label,value,color,subText){
  return `
    <div class="card">
      <div class="metric-label">${esc(label)}</div>
      <div class="metric-value" style="color:${color}">
        ${value}
      </div>
      <div class="metric-sub">${esc(subText||"")}</div>
    </div>
  `;
}

var savedVendors=LS.get("vendors");
var savedSnaps=LS.get("snaps");

if(!Array.isArray(savedVendors)||!savedVendors.length){
  savedVendors=defaultVendors();
}

if(
  !savedSnaps||
  typeof savedSnaps!=="object"||
  Array.isArray(savedSnaps)
){
  savedSnaps={};
}

var S={
  tab:"allDashboard",
  vendors:savedVendors,
  active:"dawon",
  snaps:savedSnaps,
  draft:{},
  draftDate:{},
  currentReportIndex:null,
  imported:{}
};

if(!S.vendors.some(function(vendor){
  return vendor.id===S.active;
})){
  S.active=S.vendors[0].id;
}

function save(){
  LS.set("vendors",S.vendors);
  LS.set("snaps",S.snaps);
}

function latestSnap(vendorId){
  var list=S.snaps[vendorId]||[];

  if(!list.length) return null;

  return list[list.length-1];
}

function previousSnap(vendorId){
  var list=S.snaps[vendorId]||[];

  if(list.length<2) return null;

  return list[list.length-2];
}

function compareRows(vendor,index){
  var list=S.snaps[vendor.id]||[];

  if(!list.length) return [];

  var currentIndex=
    typeof index==="number"
      ?index
      :list.length-1;

  var current=list[currentIndex];
  var previous=list[currentIndex-1];

  if(!current) return [];

  return current.rows.map(function(row){
    var previousRow=null;

    if(previous){
      previousRow=previous.rows.find(function(candidate){
        return modelKey(candidate.model)===modelKey(row.model);
      });
    }

    return {
      model:row.model,

      grades:vendor.grades.map(function(grade){
        var now=numberValue(row[grade]);

        var before=previousRow
          ?numberValue(previousRow[grade])
          :null;

        var diff=
          now!==null&&before!==null
            ?now-before
            :null;

        var pct=
          diff!==null&&before
            ?diff/before*100
            :null;

        return {
          grade:grade,
          now:now,
          before:before,
          diff:diff,
          pct:pct
        };
      })
    };
  });
}

function countMoves(rows,type){
  var count=0;

  rows.forEach(function(row){
    row.grades.forEach(function(cell){
      if(cell.diff===null) return;

      if(type==="up"&&cell.diff>0) count++;
      if(type==="down"&&cell.diff<0) count++;
      if(type==="flat"&&cell.diff===0) count++;
    });
  });

  return count;
}

function averagePct(rows){
  var values=[];

  rows.forEach(function(row){
    row.grades.forEach(function(cell){
      if(cell.pct!==null){
        values.push(cell.pct);
      }
    });
  });

  if(!values.length) return 0;

  return values.reduce(function(sum,value){
    return sum+value;
  },0)/values.length;
}

function collectMovers(rows,vendor){
  var movers=[];

  rows.forEach(function(row){
    row.grades.forEach(function(cell){
      if(cell.diff===null||cell.diff===0) return;

      movers.push({
        vendorName:vendor.name,
        model:row.model,
        grade:cell.grade,
        now:cell.now,
        before:cell.before,
        diff:cell.diff,
        pct:cell.pct
      });
    });
  });

  return movers;
}

function rankingHtml(items,type,showVendor){
  if(!items.length){
    return `<div class="empty">비교할 변동 데이터가 없습니다.</div>`;
  }

  return items.map(function(item,index){
    var className=type==="up"?"up":"down";
    var arrow=type==="up"?"▲":"▼";

    return `
      <div class="ranking-item">
        <div class="ranking-number">${index+1}</div>

        <div>
          <div class="ranking-model">${esc(item.model)}</div>
          <div class="ranking-grade">
            ${showVendor?esc(item.vendorName)+" · ":""}
            ${esc(item.grade)}
          </div>
        </div>

        <div class="ranking-amount ${className}">
          ${arrow} ${won(Math.abs(item.diff))}원

          <div class="ranking-pct">
            ${
              item.pct===null
                ?""
                :(item.pct>0?"+":"")+item.pct.toFixed(1)+"%"
            }
          </div>
        </div>
      </div>
    `;
  }).join("");
}

/* 모든 업체 최고가·최저가 비교 */
function buildAllVendorGaps(){
  var priceMap={};

  S.vendors.forEach(function(vendor){
    var snap=latestSnap(vendor.id);

    if(!snap) return;

    snap.rows.forEach(function(row){
      vendor.grades.forEach(function(grade){
        var price=numberValue(row[grade]);

        if(price===null) return;

        var key=modelKey(row.model)+"||"+gradeKey(grade);

        if(!priceMap[key]){
          priceMap[key]={
            model:row.model,
            grade:grade,
            prices:[]
          };
        }

        priceMap[key].prices.push({
          vendorId:vendor.id,
          vendorName:vendor.name,
          price:price,
          date:snap.date
        });
      });
    });
  });

  return Object.keys(priceMap)
    .map(function(key){
      return priceMap[key];
    })
    .filter(function(item){
      return item.prices.length>=2;
    })
    .map(function(item){
      item.prices.sort(function(a,b){
        return b.price-a.price;
      });

      var highest=item.prices[0];
      var lowest=item.prices[item.prices.length-1];

      return {
        model:item.model,
        grade:item.grade,
        highestVendor:highest.vendorName,
        highestPrice:highest.price,
        lowestVendor:lowest.vendorName,
        lowestPrice:lowest.price,
        gap:highest.price-lowest.price
      };
    })
    .sort(function(a,b){
      return b.gap-a.gap;
    });
}

/* 선택 업체와 다른 업체 비교 */
function buildVendorGaps(activeVendorId){
  var activeVendor=S.vendors.find(function(vendor){
    return vendor.id===activeVendorId;
  });

  var activeSnap=latestSnap(activeVendorId);

  if(!activeVendor||!activeSnap) return [];

  var rows=[];

  S.vendors
    .filter(function(vendor){
      return vendor.id!==activeVendorId;
    })
    .forEach(function(otherVendor){
      var otherSnap=latestSnap(otherVendor.id);

      if(!otherSnap) return;

      activeSnap.rows.forEach(function(activeRow){
        var otherRow=otherSnap.rows.find(function(row){
          return modelKey(row.model)===modelKey(activeRow.model);
        });

        if(!otherRow) return;

        activeVendor.grades.forEach(function(activeGrade){
          var otherGrade=otherVendor.grades.find(function(grade){
            return gradeKey(grade)===gradeKey(activeGrade);
          });

          if(!otherGrade) return;

          var activePrice=numberValue(activeRow[activeGrade]);
          var otherPrice=numberValue(otherRow[otherGrade]);

          if(activePrice===null||otherPrice===null) return;

          var gap=activePrice-otherPrice;

          rows.push({
            model:activeRow.model,
            grade:activeGrade,
            activeVendor:activeVendor.name,
            activePrice:activePrice,
            otherVendor:otherVendor.name,
            otherPrice:otherPrice,
            gap:gap,
            winner:
              gap>0
                ?activeVendor.name
                :gap<0
                  ?otherVendor.name
                  :"동일"
          });
        });
      });
    });

  return rows.sort(function(a,b){
    return Math.abs(b.gap)-Math.abs(a.gap);
  });
}

function allDashboard(){
  var dataVendors=S.vendors.filter(function(vendor){
    return latestSnap(vendor.id);
  });

  var allMovers=[];
  var modelMap={};

  dataVendors.forEach(function(vendor){
    var snap=latestSnap(vendor.id);

    snap.rows.forEach(function(row){
      modelMap[modelKey(row.model)]=row.model;
    });

    allMovers=allMovers.concat(
      collectMovers(compareRows(vendor),vendor)
    );
  });

  var upMovers=allMovers
    .filter(function(item){
      return item.diff>0;
    })
    .sort(function(a,b){
      return b.diff-a.diff;
    })
    .slice(0,10);

  var downMovers=allMovers
    .filter(function(item){
      return item.diff<0;
    })
    .sort(function(a,b){
      return a.diff-b.diff;
    })
    .slice(0,10);

  var gapRows=buildAllVendorGaps();

  var maximumGap=gapRows.length
    ?gapRows[0].gap
    :0;

  var html=sectionTitle(
    "ALL VENDORS",
    "통합 단가 대시보드",
    "등록된 모든 업체의 최신 단가와 변동을 한 화면에서 확인합니다."
  );

  html+=`
    <div class="dashboard-grid">
      ${metricCard(
        "등록 업체",
        S.vendors.length+"개",
        "var(--ink)",
        "거래처 양식 기준"
      )}

      ${metricCard(
        "데이터 보유 업체",
        dataVendors.length+"개",
        "var(--down)",
        "단가 저장 완료"
      )}

      ${metricCard(
        "통합 모델",
        Object.keys(modelMap).length+"개",
        "var(--ink)",
        "중복 모델 제외"
      )}

      ${metricCard(
        "비교 가능 항목",
        gapRows.length+"건",
        "var(--accent)",
        "2개 업체 이상"
      )}

      ${metricCard(
        "최대 GAP",
        won(maximumGap)+"원",
        maximumGap?"var(--up)":"var(--flat)",
        "최고가 - 최저가"
      )}
    </div>
  `;

  html+=`
    <div class="section">
      <div class="section-head">
        <div>
          <div class="section-title">업체별 최신 업데이트 현황</div>
          <div class="section-desc">
            아직 단가표가 없는 업체도 바로 확인할 수 있습니다.
          </div>
        </div>
      </div>

      <div class="vendor-status">
        ${
          S.vendors.map(function(vendor){
            var snap=latestSnap(vendor.id);

            return `
              <div class="card">
                <strong>${esc(vendor.name)}</strong>

                <small>
                  ${
                    snap
                      ?"최근 저장: "+esc(snap.date)+
                        " · "+snap.rows.length+"개 모델"

function normalizeExcelHeader(value){
  return String(value||"")
    .trim()
    .toUpperCase()
    .replace(/\s+/g,"")
    .replace(/급/g,"");
}

function isModelHeader(value){
  return [
    "모델",
    "모델명",
    "기종",
    "기종명",
    "MODEL",
    "MODELNAME"
  ].indexOf(normalizeExcelHeader(value))!==-1;
}

function excelNumber(value){
  if(value==null||value==="") return "";

  if(typeof value==="number"){
    return value;
  }

  var cleaned=String(value)
    .replace(/,/g,"")
    .replace(/원/g,"")
    .replace(/[^0-9.-]/g,"");

  if(!cleaned) return "";

  var number=Number(cleaned);

  return isNaN(number)?"":number;
}

function parseExcelSheet(sheet,vendor){
  var matrix=XLSX.utils.sheet_to_json(sheet,{
    header:1,
    defval:"",
    raw:false
  });

  if(!matrix.length) return [];

  var headerRowIndex=-1;
  var modelColumnIndex=-1;
  var gradeColumns={};

  for(
    var rowIndex=0;
    rowIndex<matrix.length;
    rowIndex++
  ){
    var candidate=matrix[rowIndex];
    var candidateModelColumn=-1;
    var candidateGrades={};

    candidate.forEach(function(cell,columnIndex){
      if(isModelHeader(cell)){
        candidateModelColumn=columnIndex;
      }

      vendor.grades.forEach(function(grade){
        if(gradeKey(cell)===gradeKey(grade)){
          candidateGrades[grade]=columnIndex;
        }
      });
    });

    if(
      candidateModelColumn>=0&&
      Object.keys(candidateGrades).length>0
    ){
      headerRowIndex=rowIndex;
      modelColumnIndex=candidateModelColumn;
      gradeColumns=candidateGrades;
      break;
    }
  }

  if(headerRowIndex<0) return [];

  var rows=[];

  for(
    var dataIndex=headerRowIndex+1;
    dataIndex<matrix.length;
    dataIndex++
  ){
    var sourceRow=matrix[dataIndex];

    var model=String(
      sourceRow[modelColumnIndex]||""
    ).trim();

    if(!model) continue;

    var row=emptyRow(vendor.grades);
    row.model=model;

    vendor.grades.forEach(function(grade){
      var columnIndex=gradeColumns[grade];

      row[grade]=
        columnIndex===undefined
          ?""
          :excelNumber(sourceRow[columnIndex]);
    });

    rows.push(row);
  }

  return rows;
}

                </th>`;
              }).join("")
            }
          </tr>
        </thead>

        <tbody>
          ${
            rows.map(function(row){
              return `
                <tr>
                  <td
                    style="
                      text-align:left;
                      background:#fbfaf7;
                      font-weight:700
                    "
                  >
                    ${esc(row.model)}
                  </td>

                  ${
                    row.grades.map(function(cell){
                      var detail="";

                      if(cell.diff!==null&&cell.diff!==0){
                        detail=`
                          <div
                            style="
                              font-size:11px;
                              color:${
                                cell.diff<0
                                  ?"var(--down)"
                                  :"var(--up)"
                              }
                            "
                          >
                            ${cell.diff<0?"▼":"▲"}
                            ${won(Math.abs(cell.diff))}
                            ${
                              cell.pct!==null
                                ?" ("+
                                  (cell.pct>0?"+":"")+
                                  cell.pct.toFixed(1)+"%)"
                                :""
                            }
                          </div>
                        `;
                      }

                      return `
                        <td style="text-align:right">
                          <div style="font-weight:700">
                            ${
                              cell.now===null
                                ?"-"
                                :won(cell.now)
                            }
                          </div>

                          ${detail}
                        </td>
                      `;
                    }).join("")
                  }
                </tr>
              `;
            }).join("")
          }
        </tbody>
      </table>
    </div>
  `;

  return html;
}

function vendorTab(){
  return sectionTitle(
    "VENDOR TEMPLATES",
    "거래처 양식 관리",
    "거래처마다 사용하는 등급 칸을 등록할 수 있습니다."
  )+
  `
    <div
      style="
        display:flex;
        gap:12px;
        flex-wrap:wrap;
        background:#fff;
        padding:16px;
        border-radius:10px;
        border:1px solid var(--line)
      "
    >
      <div style="flex:1;min-width:180px">
        <label>거래처 이름</label>

        <input
          id="vendorName"
          placeholder="예: 새 거래처"
          style="
            width:100%;
            padding:9px 12px;
            border:1px solid var(--line);
            border-radius:8px
          "
        >
      </div>

      <div style="flex:2;min-width:240px">
        <label>등급 칸, 쉼표로 구분</label>

        <input
          id="vendorGrades"
          value="A급, A-급, B+급, B급, 액파, LCD"
          style="
            width:100%;
            padding:9px 12px;
            border:1px solid var(--line);
            border-radius:8px
          "
        >
      </div>

      <button
        class="bp"
        id="vendorAdd"
        style="align-self:flex-end;height:40px"
      >
        + 추가
      </button>
    </div>

    <div style="display:grid;gap:10px;margin-top:20px">
      ${
        S.vendors.map(function(vendor){
          return `
            <div
              style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                background:#fff;
                border:1px solid var(--line);
                border-radius:10px;
                padding:14px 16px;
                gap:12px;
                flex-wrap:wrap
              "
            >
              <div>
                <div style="font-weight:700">
                  ${esc(vendor.name)}
                </div>

                <div style="margin-top:5px">
                  ${
                    vendor.grades.map(function(grade){
                      return `
                        <span
                          style="
                            display:inline-block;
                            background:var(--soft);
                            border-radius:5px;
                            padding:2px 8px;
                            margin-right:5px;
                            margin-top:4px;
                            font-size:11px
                          "
                        >
                          ${esc(grade)}
                        </span>
                      `;
                    }).join("")
                  }
                </div>
              </div>

              <div style="display:flex;gap:6px">
                <button
                  class="bgs vendorInput"
                  data-vendor="${vendor.id}"
                >
                  입력하기
                </button>

                <button
                  class="bgs vendorDelete"
                  data-vendor="${vendor.id}"
                  style="color:#c0392b"
                >
                  삭제
                </button>
              </div>
            </div>
          `;
        }).join("")
      }
    </div>
  `;
}

function render(){
  var vendor=S.vendors.find(function(item){
    return item.id===S.active;
  });

  if(!vendor){
    S.active=S.vendors[0].id;
    vendor=S.vendors[0];
  }

  var showVendorBar=S.tab!=="allDashboard";

  A.innerHTML=`
    <header>
      <div>
        <div class="eyebrow">
          DAWON TRADE · WEEKLY PRICE
        </div>

        <h1>통합 단가 보고서</h1>
      </div>

      <div class="tabs">
        <button
          class="tb ${S.tab==="allDashboard"?"on":""}"
          data-tab="allDashboard"
        >
          통합 대시보드
        </button>

        <button
          class="tb ${S.tab==="vendorDashboard"?"on":""}"
          data-tab="vendorDashboard"
        >
          업체별 대시보드
        </button>

        <button
          class="tb ${S.tab==="input"?"on":""}"
          data-tab="input"
        >
          단가 입력
        </button>

        <button
          class="tb ${S.tab==="report"?"on":""}"
          data-tab="report"
        >
          주간 보고서
        </button>

        <button
          class="tb ${S.tab==="vendors"?"on":""}"
          data-tab="vendors"
        >
          거래처 양식
        </button>
      </div>
    </header>

    ${
      showVendorBar
        ?`
          <div class="vbar">
            <span style="font-size:12px;color:var(--sub)">
              거래처
            </span>

            ${
              S.vendors.map(function(item){
                return `
                  <button
                    class="chip ${S.active===item.id?"on":""}"
                    data-vendor-chip="${item.id}"
                  >
                    ${esc(item.name)}
                  </button>
                `;
              }).join("")
            }
          </div>
        `
        :""
    }

    <div class="wrap">
      ${
        S.tab==="allDashboard"
          ?allDashboard()
          :S.tab==="vendorDashboard"
            ?vendorDashboard(vendor)
            :S.tab==="input"
              ?inputTab(vendor)
              :S.tab==="report"
                ?reportTab(vendor)
                :vendorTab()
      }
    </div>
  `;

  bind();
}

function bind(){
  document.querySelectorAll("[data-tab]")
    .forEach(function(button){
      button.onclick=function(){
        S.tab=button.getAttribute("data-tab");
        S.currentReportIndex=null;
        render();
      };
    });

  document.querySelectorAll("[data-vendor-chip]")
    .forEach(function(button){
      button.onclick=function(){
        S.active=button.getAttribute("data-vendor-chip");
        S.currentReportIndex=null;
        render();
      };
    });

  var vendor=S.vendors.find(function(item){
    return item.id===S.active;
  });

  if(S.tab==="input"){
    var rows=S.draft[vendor.id];

    document.querySelectorAll(".modelInput")
      .forEach(function(input){
        input.oninput=function(){
          rows[Number(input.dataset.row)].model=input.value;
        };
      });

    document.querySelectorAll(".priceInput")
      .forEach(function(input){
        input.oninput=function(){
          var value=input.value.replace(/[^0-9]/g,"");
          input.value=value;

          rows[Number(input.dataset.row)][input.dataset.grade]=
            value===""?"":Number(value);
        };
      });

    document.querySelectorAll(".deleteRow")
      .forEach(function(button){
        button.onclick=function(){
          rows.splice(Number(button.dataset.row),1);

          if(!rows.length){
            rows.push(emptyRow(vendor.grades));
          }

          render();
        };
      });

    var saveDate=document.getElementById("saveDate");

    saveDate.onchange=function(){
      S.draftDate[vendor.id]=saveDate.value||todayISO();
    };

    var excelButton=document.getElementById("excelButton");
    var excelFile=document.getElementById("excelFile");

    excelButton.onclick=function(){
      excelFile.value="";
      excelFile.click();
    };

    excelFile.onchange=function(){
      var file=excelFile.files[0];

      if(!file) return;

      if(typeof XLSX==="undefined"){
        toast(
          "엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요."
        );
        return;
      }

      var reader=new FileReader();

      reader.onload=function(event){
        try{
          var workbook=XLSX.read(event.target.result,{
            type:"array"
          });

          var preferred=["중고단가","폴드플립"];

          var targetSheets=workbook.SheetNames.filter(function(name){
            return preferred.indexOf(String(name).trim())!==-1;
          });

          if(!targetSheets.length){
            targetSheets=workbook.SheetNames.slice();
          }

          var importedRows=[];

          targetSheets.forEach(function(sheetName){
            importedRows=importedRows.concat(
              parseExcelSheet(
                workbook.Sheets[sheetName],
                vendor
              )
            );
          });

          var merged={};

          importedRows.forEach(function(row){
            var key=modelKey(row.model);

            if(!key) return;

            if(!merged[key]){
              merged[key]=row;
              return;
            }

            vendor.grades.forEach(function(grade){
              if(row[grade]!==""){
                merged[key][grade]=row[grade];
              }
            });
          });

          var finalRows=Object.keys(merged).map(function(key){
            return merged[key];
          });

          if(!finalRows.length){
            toast(
              "모델명과 등급 열을 찾지 못했습니다."
            );
            return;
          }

          S.draft[vendor.id]=finalRows;

          S.imported[vendor.id]={
            fileName:file.name,
            rowCount:finalRows.length,
            sheets:targetSheets
          };

          toast(
            finalRows.length+
            "개 모델을 엑셀에서 불러왔습니다."
          );

          render();

        }catch(error){
          console.error(error);
          toast("엑셀을 읽는 중 오류가 발생했습니다.");
        }
      };

      reader.readAsArrayBuffer(file);
    };

    document.getElementById("pasteButton").onclick=function(){
      var panel=document.getElementById("pastePanel");

      panel.style.display=
        panel.style.display==="none"
          ?"block"
          :"none";
    };

    document.getElementById("pasteCancel").onclick=function(){
      document.getElementById("pastePanel").style.display="none";
    };

    document.getElementById("pasteLoad").onclick=function(){
      var text=document.getElementById("pasteText").value.trim();

      if(!text){
        toast("붙여넣을 내용을 입력해 주세요.");
        return;
      }

      var parsed=text
        .split("\n")
        .filter(function(line){
          return line.trim();
        })
        .map(function(line){
          var parts=line
            .split(/\t|,|\s{2,}/)
            .map(function(item){
              return item.trim();
            })
            .filter(Boolean);

          if(parts.length<2){
            parts=line.split(/\s+/);
          }

          var row=emptyRow(vendor.grades);
          row.model=parts[0]||"";

          vendor.grades.forEach(function(grade,index){
            var raw=String(parts[index+1]||"")
              .replace(/[^0-9]/g,"");

            row[grade]=raw?Number(raw):"";
          });

          return row;
        });

      S.draft[vendor.id]=parsed;

      S.imported[vendor.id]={
        fileName:"붙여넣기",
        rowCount:parsed.length,
        sheets:["직접 붙여넣기"]
      };

      toast(parsed.length+"행을 불러왔습니다.");
      render();
    };

    document.getElementById("addRow").onclick=function(){
      rows.push(emptyRow(vendor.grades));
      render();
    };

    document.getElementById("clearRows").onclick=function(){
      if(!confirm("현재 입력된 내용을 모두 지울까요?")){
        return;
      }

      S.draft[vendor.id]=[emptyRow(vendor.grades)];
      delete S.imported[vendor.id];

      render();
    };

    document.getElementById("saveButton").onclick=function(){
      var cleanRows=rows.filter(function(row){
        return String(row.model||"").trim();
      });

      if(!cleanRows.length){
        toast("저장할 데이터가 없습니다.");
        return;
      }

      var selectedDate=
        S.draftDate[vendor.id]||
        todayISO();

      var snapshot={
        date:selectedDate,
        rows:cleanRows.map(function(row){
          return Object.assign({},row);
        })
      };

      var list=(S.snaps[vendor.id]||[]).slice();

      var existingIndex=list.findIndex(function(snap){
        return snap.date===selectedDate;
      });

      if(existingIndex>=0){
        if(!confirm(
          selectedDate+
          " 자료가 이미 있습니다.\n기존 자료를 덮어쓸까요?"
        )){
          return;
        }

        list[existingIndex]=snapshot;
      }else{
        list.push(snapshot);
      }

      list.sort(function(a,b){
        return a.date.localeCompare(b.date);
      });

      S.snaps[vendor.id]=list;

      save();

      toast(selectedDate+" 단가 저장 완료!");
    };
  }

  if(S.tab==="report"){
    var reportDate=document.getElementById("reportDate");

    if(reportDate){
      reportDate.onchange=function(){
        S.currentReportIndex=Number(reportDate.value);
        render();
      };
    }
  }

  if(S.tab==="vendors"){
    document.getElementById("vendorAdd").onclick=function(){
      var name=document.getElementById("vendorName")
        .value
        .trim();

      var grades=document.getElementById("vendorGrades")
        .value
        .split(",")
        .map(function(grade){
          return grade.trim();
        })
        .filter(Boolean);

      if(!name){
        toast("거래처 이름을 입력하세요.");
        return;
      }

      if(!grades.length){
        toast("등급을 입력하세요.");
        return;
      }

      S.vendors.push({
        id:"v"+Date.now(),
        name:name,
        grades:grades
      });

      save();
      render();
    };

    document.querySelectorAll(".vendorInput")
      .forEach(function(button){
        button.onclick=function(){
          S.active=button.dataset.vendor;
          S.tab="input";
          render();
        };
      });

    document.querySelectorAll(".vendorDelete")
      .forEach(function(button){
        button.onclick=function(){
          if(S.vendors.length<=1){
            toast("최소 1개의 거래처가 필요합니다.");
            return;
          }

          var id=button.dataset.vendor;

          if(!confirm("선택한 거래처 양식을 삭제할까요?")){
            return;
          }

          S.vendors=S.vendors.filter(function(vendor){
            return vendor.id!==id;
          });

          if(S.active===id){
            S.active=S.vendors[0].id;
          }

          save();
          render();
        };
      });
  }
}

render();

})();
</script>
</body>
</html>
