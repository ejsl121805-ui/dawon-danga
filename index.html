        var source=sale||stock||{},purchaseCost=sale?stockMoney(sale.purchaseCost):0;if(!purchaseCost&&stock)purchaseCost=stockMoney(stock.unitCost);
        var salePrice=sale?stockMoney(sale.unitPrice):0,profit=sale?num(sale.profit):null;if(profit===null&&purchaseCost&&salePrice)profit=salePrice-purchaseCost;
        return{
          status:status,
          model:stockModelLabel(source)||stockModelLabel(stock),
          modelCode:rowModelCode(source)||rowModelCode(stock),
          petName:rowPetName(source)||rowPetName(stock),
          grade:stockGrade(source.grade||(stock&&stock.grade)),
          qty:Math.max(0,num(source.qty)||num(stock&&stock.qty)||1),
          pgNo:String(source.pgNo||(stock&&stock.pgNo)||"").trim(),
          imei:String(source.imei||(stock&&stock.imei)||"").trim(),
          purchaseDate:stockDate(source.purchaseDate||(stock&&(stock.receivedDate||stock.date)))||"",
          purchaseVendor:String(source.purchaseVendor||(stock&&stock.purchaseVendor)||"").trim(),
          purchaseCost:purchaseCost,
          saleDate:sale?stockDate(sale.date)||"":"",
          saleVendor:sale?String(sale.saleVendor||"").trim():"",
          salePrice:salePrice,

        }
      }

      stockRows.forEach(function(stock){
        var candidates=[];
        stockIdentityKeys(stock).forEach(function(key){if(saleKeys[key])candidates=candidates.concat(saleKeys[key])});
        candidates=candidates.filter(function(index,pos,all){return all.indexOf(index)===pos&&!usedSales[index]});

          var saleIndex=candidates[0];usedSales[saleIndex]=1;result.push(mergedRow(stock,sales[saleIndex],"sold"))

        var salesLedgerSearch=document.getElementById("salesLedgerSearch"),salesLedgerCount=document.getElementById("salesLedgerCount");
        function applySalesLedgerSearch(){
          var q=rawKey(S.salesSearch),count=0;document.querySelectorAll(".device-ledger-row").forEach(function(row){var searchOk=!q||String(row.dataset.deviceSearch||"").indexOf(q)>=0,statusOk=S.stockDeviceStatus==="all"||row.dataset.deviceStatus===S.stockDeviceStatus,show=searchOk&&statusOk;row.style.display=show?"":"none";if(show)count++});if(salesLedgerCount)salesLedgerCount.textContent=count+"개 내역"
        }
        if(salesLedgerSearch){salesLedgerSearch.oninput=function(){S.salesSearch=salesLedgerSearch.value;applySalesLedgerSearch()};applySalesLedgerSearch()}
        document.querySelectorAll("[data-device-status-filter]").forEach(function(button){button.onclick=function(){S.stockDeviceStatus=button.dataset.deviceStatusFilter||"all";render()}});
        var profitGroupSearch=document.getElementById("profitGroupSearch"),profitGroupCount=document.getElementById("profitGroupCount");
        function applyProfitGroupSearch(){
          var q=rawKey(S.profitSearch),count=0;document.querySelectorAll(".profit-group-row").forEach(function(row){var show=!q||String(row.dataset.profitSearch||"").indexOf(q)>=0;row.style.display=show?"":"none";if(show)count++});if(profitGroupCount)profitGroupCount.textContent=count+"개 조합"
        }
        if(profitGroupSearch){profitGroupSearch.oninput=function(){S.profitSearch=profitGroupSearch.value;applyProfitGroupSearch()};applyProfitGroupSearch()}
        var stockExample=document.getElementById("stockExample");if(stockExample)stockExample.onclick=function(){if((S.inventory.length||S.inbound.length||S.sales.length)&&!confirm("현재 재고·입고·판매 자료를 예시 데이터로 바꿀까요?"))return;S.inventory=exampleInventory();S.inbound=exampleInbound();S.sales=exampleSales();S.stockFiles={inventory:"예시 데이터",inbound:"예시 데이터",sales:"예시 데이터"};S.stockBatches={};S.stockBaselineDate=today();S.stockCloseDate=today();write();toast("예시 데이터를 다시 채웠습니다.");render()};
        var stockClear=document.getElementById("stockClear");if(stockClear)stockClear.onclick=function(){if(!confirm("기초재고·매입·판매 누적자료를 모두 지울까요? 단가 자료는 지워지지 않습니다."))return;S.inventory=[];S.inbound=[];S.sales=[];S.stockFiles={};S.stockBatches={};S.stockBaselineDate="";S.stockCloseDate="";write();toast("재고·판매 누적자료를 초기화했습니다.");render()}
      }
      if(S.tab==="report"){
        var monthSelect=document.getElementById("reportMonth");if(monthSelect)monthSelect.onchange=function(){S.reportMonth=monthSelect.value;S.reportWeek=null;render()};
        document.querySelectorAll("[data-report-week]").forEach(function(b){b.onclick=function(){S.reportWeek=+b.dataset.reportWeek;render()}});
        function collectReportNotes(){
          var exportNote=document.getElementById("noteExport"),inventoryNote=document.getElementById("noteInventory"),buyerNote=document.getElementById("noteBuyer"),eventsNote=document.getElementById("noteEvents"),weeklyNote=document.getElementById("noteWeekly");
          if(!exportNote)return;
          S.reportNotes[S.reportMonth]={exportMarket:exportNote.value,inventory:inventoryNote.value,buyer:buyerNote.value,events:eventsNote.value};
          S.reportNotes[S.reportMonth+"-W"+S.reportWeek]={weekly:weeklyNote.value}
        }
        var saveReportNotes=document.getElementById("saveReportNotes");if(saveReportNotes)saveReportNotes.onclick=function(){collectReportNotes();write();toast("월간·주간 현장 메모를 저장했습니다.");render()};
        var archiveReport=document.getElementById("archiveReport");if(archiveReport)archiveReport.onclick=function(){
          if(!reportPair(dawonVendor().id,S.reportMonth,null))return toast("확정할 다원 단가 자료가 없습니다.");
          if(S.reportArchives[S.reportMonth]&&!confirm("기존 확정 기록을 현재 내용으로 다시 저장할까요?"))return;
          collectReportNotes();S.reportArchives[S.reportMonth]=reportArchiveSnapshot(S.reportMonth);write();toast(reportMonthLabel(S.reportMonth)+" 보고서를 확정 기록으로 저장했습니다.");render()
        };
        var downloadArchive=document.getElementById("downloadArchive");if(downloadArchive)downloadArchive.onclick=function(){
          var data=S.reportArchives[S.reportMonth];if(!data)return toast("저장된 확정 기록이 없습니다.");
          var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json;charset=utf-8"}),link=document.createElement("a");link.href=URL.createObjectURL(blob);link.download="다원트레이드_"+S.reportMonth+"_월간보고서_확정기록.json";link.click();setTimeout(function(){URL.revokeObjectURL(link.href)},1000);toast("월간 확정 기록을 저장했습니다.")
        };
        var printReport=document.getElementById("printReport");if(printReport)printReport.onclick=function(){window.print()}
      }
      if(S.tab==="vendors"){
        document.getElementById("addVendor").onclick=function(){var n=document.getElementById("newName").value.trim(),g=document.getElementById("newGrades").value.split(",").map(function(x){return x.trim()}).filter(Boolean);if(!n||!g.length)return toast("거래처 이름과 등급을 입력해 주세요.");S.vendors.push({id:"v"+Date.now(),name:n,grades:g});write();render()};
        document.querySelectorAll(".pick").forEach(function(b){b.onclick=function(){S.active=b.dataset.id;S.tab="input";render()}});
        document.querySelectorAll(".rename").forEach(function(b){b.onclick=function(){var target=S.vendors.find(function(v){return v.id===b.dataset.id});if(!target)return;var next=prompt("새 거래처 이름을 입력하세요.",target.name);if(next===null)return;next=next.trim();if(!next)return toast("이름을 입력해 주세요.");target.name=next;write();toast("거래처 이름을 수정했습니다.");render()}});
        document.querySelectorAll(".remove").forEach(function(b){b.onclick=function(){if(S.vendors.length<=1)return toast("최소 한 업체가 필요합니다.");if(!confirm("이 거래처 양식을 삭제할까요?"))return;S.vendors=S.vendors.filter(function(v){return v.id!==b.dataset.id});if(S.active===b.dataset.id)S.active=S.vendors[0].id;write();render()}});
      }
    }
    render();
  }());
  </script>
</body>
</html>
