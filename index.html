<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>다원트레이드 단가 대시보드</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --ink: #14202e;
    --paper: #f7f5f0;
    --line: #dcd6ca;
    --sub: #6b6558;
    --up: #c0392b;
    --down: #1f6e5a;
    --flat: #8a8375;
    --accent: #c8892a;
    --soft: #efece4;
    --white: #ffffff;
  }

  body {
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Malgun Gothic",
      sans-serif;

    background: var(--paper);
    color: var(--ink);
    line-height: 1.5;
  }

  button,
  input,
  textarea,
  select {
    font-family: inherit;
  }

  button {
    cursor: pointer;
  }

  header {
    background: var(--ink);
    color: #fff;
    padding: 18px 20px;

    display: flex;
    justify-content: space-between;
    align-items: flex-end;

    flex-wrap: wrap;
    gap: 12px;
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--accent);
    font-weight: 700;
  }

  header h1 {
    font-size: 22px;
    margin-top: 2px;
  }

  .tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .tb {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.25);

    font-size: 13px;
    font-weight: 600;

    background: transparent;
    color: var(--paper);
  }

  .tb.on {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .vbar {
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 12px 20px;

    background: var(--soft);
    border-bottom: 1px solid var(--line);

    flex-wrap: wrap;
  }

  .chip {
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--line);

    font-size: 13px;
    font-weight: 600;

    background: #fff;
    color: var(--ink);
  }

  .chip.on {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  .wrap {
    padding: 0 20px 60px;
    max-width: 1180px;
    margin: 0 auto;
  }

  .st {
    margin: 22px 0 18px;
  }

  .st .ey {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--accent);
    font-weight: 700;
  }

  .st h2 {
    font-size: 22px;
    margin: 4px 0 6px;
  }

  .st p {
    font-size: 13px;
    color: var(--sub);
  }

  .bp {
    background: var(--accent);
    color: #fff;
    border: none;

    padding: 10px 18px;
    border-radius: 8px;

    font-size: 14px;
    font-weight: 700;
  }

  .bg {
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--line);

    padding: 9px 14px;
    border-radius: 8px;

    font-size: 13px;
    font-weight: 600;
  }

  .bgs {
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--line);

    padding: 6px 12px;
    border-radius: 6px;

    font-size: 12px;
    font-weight: 600;
  }

  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
  }

  .dashboard-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 22px;
  }

  .metric-label {
    font-size: 12px;
    color: var(--sub);
    margin-bottom: 5px;
  }

  .metric-value {
    font-size: 27px;
    font-weight: 800;
    letter-spacing: -1px;
  }

  .metric-sub {
    margin-top: 4px;
    font-size: 11px;
    color: var(--sub);
  }

  .section {
    margin-top: 22px;
  }

  .section-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;

    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .section-title {
    font-size: 16px;
    font-weight: 800;
  }

  .section-desc {
    font-size: 12px;
    color: var(--sub);
    margin-top: 3px;
  }

  .two-column {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .ranking-list {
    display: grid;
    gap: 6px;
  }

  .ranking-item {
    display: grid;
    grid-template-columns: 34px minmax(120px, 1fr) auto;

    align-items: center;
    gap: 8px;

    border-bottom: 1px solid #eee9df;
    padding: 9px 2px;
  }

  .ranking-item:last-child {
    border-bottom: none;
  }

  .ranking-number {
    width: 28px;
    height: 28px;
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--soft);
    font-size: 12px;
    font-weight: 800;
  }

  .ranking-model {
    font-size: 13px;
    font-weight: 700;
  }

  .ranking-grade {
    margin-top: 2px;
    font-size: 11px;
    color: var(--sub);
  }

  .ranking-amount {
    text-align: right;
    font-size: 13px;
    font-weight: 800;
  }

  .ranking-pct {
    font-size: 11px;
    font-weight: 600;
    margin-top: 2px;
  }

  .up {
    color: var(--up);
  }

  .down {
    color: var(--down);
  }

  .flat {
    color: var(--flat);
  }

  .empty {
    padding: 35px 20px;
    text-align: center;
    color: var(--sub);
    font-size: 13px;

    background: #fff;
    border: 1px dashed var(--line);
    border-radius: 10px;
  }

  .control-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .control-row label {
    font-size: 12px;
    color: var(--sub);
    font-weight: 600;
  }

  .control-row select,
  .control-row input[type="date"] {
    padding: 8px 11px;
    border: 1px solid var(--line);
    border-radius: 8px;

    font-size: 13px;
    background: #fff;
    color: var(--ink);
  }

  .chart-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
  }

  .chart-wrap {
    width: 100%;
    overflow-x: auto;
  }

  .comment-box {
    background: var(--ink);
    color: #f7f5f0;

    border-radius: 12px;
    padding: 18px;
  }

  .comment-box h3 {
    font-size: 15px;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .comment-box ul {
    padding-left: 19px;
  }

  .comment-box li {
    margin-bottom: 8px;
    font-size: 13px;
    line-height: 1.7;
  }

  .comment-box li:last-child {
    margin-bottom: 0;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    background: #fff;
    font-size: 13px;
  }

  th {
    background: var(--ink);
    color: #fff;

    padding: 10px 8px;

    font-weight: 600;
    font-size: 12px;
    text-align: center;
  }

  td {
    border-bottom: 1px solid var(--line);
    border-right: 1px solid #f0ece3;
    padding: 7px 8px;
  }

  .tblwrap {
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: 10px;
  }

  .ci {
    width: 100%;
    border: 1px solid transparent;
    background: transparent;

    padding: 6px 4px;
    font-size: 13px;

    outline: none;
    border-radius: 4px;
  }

  .ci:focus {
    border-color: var(--accent);
    background: #fffdf8;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;

    transform: translateX(-50%);

    background: var(--ink);
    color: #fff;

    padding: 12px 22px;
    border-radius: 10px;

    font-size: 13.5px;
    font-weight: 600;

    z-index: 100;
    max-width: 90%;
  }

  .gap-positive {
    color: var(--up);
    font-weight: 800;
  }

  .gap-negative {
    color: var(--down);
    font-weight: 800;
  }

  .gap-zero {
    color: var(--flat);
    font-weight: 800;
  }

  .status-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 12px;

    font-size: 11px;
    font-weight: 700;

    background: var(--soft);
  }

  @media (max-width: 920px) {
    .dashboard-grid {
      grid-template-columns: repeat(2, minmax(130px, 1fr));
    }

    .two-column {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 600px) {
    header {
      align-items: flex-start;
    }

    .wrap {
      padding-left: 12px;
      padding-right: 12px;
    }

    .dashboard-grid {
      grid-template-columns: 1fr 1fr;
    }

    .metric-value {
      font-size: 23px;
    }

    .tb {
      padding: 7px 10px;
      font-size: 12px;
    }

    .ranking-item {
      grid-template-columns: 30px minmax(100px, 1fr) auto;
    }
  }
</style>
</head>

<body>

<div id="app"></div>

<script>
(function () {
  "use strict";

  var A = document.getElementById("app");

  var LS = {
    get: function (key) {
      try {
        return JSON.parse(localStorage.getItem("dw_" + key));
      } catch (error) {
        return null;
      }
    },

    set: function (key, value) {
      try {
        localStorage.setItem(
          "dw_" + key,
          JSON.stringify(value)
        );
      } catch (error) {
        console.error("저장 실패:", error);
      }
    }
  };

  function won(value) {
    if (
      value === "" ||
      value === null ||
      value === undefined ||
      isNaN(value)
    ) {
      return "-";
    }

    return Number(value).toLocaleString("ko-KR");
  }

  function signedWon(value) {
    if (value === null || value === undefined || isNaN(value)) {
      return "-";
    }

    if (value > 0) {
      return "+" + won(value) + "원";
    }

    if (value < 0) {
      return "-" + won(Math.abs(value)) + "원";
    }

    return "0원";
  }

  function todayISO() {
    var date = new Date();

    var year = date.getFullYear();
    var month = String(date.getMonth() + 1).padStart(2, "0");
    var day = String(date.getDate()).padStart(2, "0");

    return year + "-" + month + "-" + day;
  }

  function weekLabel(dateString) {
    if (!dateString) {
      return "";
    }

    var date = new Date(dateString + "T00:00:00");
    var firstDay = new Date(date.getFullYear(), 0, 1);

    var week = Math.ceil(
      (
        (date - firstDay) / 86400000 +
        firstDay.getDay() +
        1
      ) / 7
    );

    return (
      date.getFullYear() +
      "년 " +
      (date.getMonth() + 1) +
      "월 " +
      week +
      "주차"
    );
  }

  function emptyRow(columns) {
    var row = {
      model: ""
    };

    columns.forEach(function (grade) {
      row[grade] = "";
    });

    return row;
  }

  function defVendors() {
    return [
      {
        id: "dawon",
        name: "다원(자체)",
        grades: [
          "A급",
          "A-급",
          "B+급",
          "B급",
          "액파",
          "LCD"
        ]
      },
      {
        id: "jinwoo",
        name: "진우아이엔씨",
        grades: [
          "A급",
          "A-급",
          "B+급",
          "B급",
          "액정파손",
          "LCD"
        ]
      }
    ];
  }

  function esc(value) {
    return String(
      value === null || value === undefined
        ? ""
        : value
    ).replace(
      /[&<>"]/g,
      function (character) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;"
        }[character];
      }
    );
  }

  function modelKey(model) {
    return String(model || "")
      .toLowerCase()
      .replace(/\s+/g, "")
      .replace(/[_-]/g, "");
  }

  function gradeKey(grade) {
    var key = String(grade || "")
      .toUpperCase()
      .replace(/\s+/g, "")
      .replace(/급/g, "");

    if (
      key === "액정파손" ||
      key === "액정파손품" ||
      key === "액파"
    ) {
      return "액파";
    }

    return key;
  }

  function numberValue(value) {
    if (
      value === "" ||
      value === null ||
      value === undefined
    ) {
      return null;
    }

    var number = Number(value);

    return isNaN(number)
      ? null
      : number;
  }

  var savedVendors = LS.get("vendors");
  var savedSnaps = LS.get("snaps");

  if (
    !Array.isArray(savedVendors) ||
    savedVendors.length === 0
  ) {
    savedVendors = defVendors();
  }

  if (
    !savedSnaps ||
    typeof savedSnaps !== "object" ||
    Array.isArray(savedSnaps)
  ) {
    savedSnaps = {};
  }

  var S = {
    tab: "dashboard",
    vendors: savedVendors,
    active: "dawon",
    snaps: savedSnaps,
    draft: {},
    draftDate: {},
    curIdx: null,
    dashModel: "",
    dashGrade: ""
  };

  if (
    !S.vendors.some(function (vendor) {
      return vendor.id === S.active;
    })
  ) {
    S.active = S.vendors[0].id;
  }

  function save() {
    LS.set("vendors", S.vendors);
    LS.set("snaps", S.snaps);
  }

  function toast(message) {
    var oldToast = document.querySelector(".toast");

    if (oldToast) {
      oldToast.remove();
    }

    var element = document.createElement("div");

    element.className = "toast";
    element.textContent = message;

    document.body.appendChild(element);

    setTimeout(function () {
      element.remove();
    }, 3000);
  }

  function latestSnap(vendorId) {
    var list = S.snaps[vendorId] || [];

    if (!list.length) {
      return null;
    }

    return list[list.length - 1];
  }

  function previousSnap(vendorId) {
    var list = S.snaps[vendorId] || [];

    if (list.length < 2) {
      return null;
    }

    return list[list.length - 2];
  }

  function compareSnapshotRows(vendor, currentIndex) {
    var list = S.snaps[vendor.id] || [];

    if (!list.length) {
      return [];
    }

    var index =
      typeof currentIndex === "number"
        ? currentIndex
        : list.length - 1;

    var current = list[index];
    var previous = list[index - 1];

    if (!current) {
      return [];
    }

    return current.rows.map(function (row) {
      var previousRow = null;

      if (previous) {
        previousRow = previous.rows.find(function (candidate) {
          return modelKey(candidate.model) === modelKey(row.model);
        });
      }

      var grades = vendor.grades.map(function (grade) {
        var now = numberValue(row[grade]);

        var before =
          previousRow
            ? numberValue(previousRow[grade])
            : null;

        var diff =
          now !== null && before !== null
            ? now - before
            : null;

        var pct =
          diff !== null && before
            ? diff / before * 100
            : null;

        return {
          grade: grade,
          now: now,
          before: before,
          diff: diff,
          pct: pct
        };
      });

      return {
        model: row.model,
        grades: grades
      };
    });
  }

  function countMoves(rows, type) {
    var count = 0;

    rows.forEach(function (row) {
      row.grades.forEach(function (cell) {
        if (cell.diff === null) {
          return;
        }

        if (type === "up" && cell.diff > 0) {
          count++;
        }

        if (type === "down" && cell.diff < 0) {
          count++;
        }

        if (type === "flat" && cell.diff === 0) {
          count++;
        }
      });
    });

    return count;
  }

  function averagePctNumber(rows) {
    var values = [];

    rows.forEach(function (row) {
      row.grades.forEach(function (cell) {
        if (cell.pct !== null) {
          values.push(cell.pct);
        }
      });
    });

    if (!values.length) {
      return 0;
    }

    return values.reduce(function (sum, value) {
      return sum + value;
    }, 0) / values.length;
  }

  function averagePctText(rows) {
    var value = averagePctNumber(rows);

    return (
      (value > 0 ? "+" : "") +
      value.toFixed(1)
    );
  }

  function collectMovers(rows) {
    var movers = [];

    rows.forEach(function (row) {
      row.grades.forEach(function (cell) {
        if (
          cell.diff === null ||
          cell.diff === 0
        ) {
          return;
        }

        movers.push({
          model: row.model,
          grade: cell.grade,
          now: cell.now,
          before: cell.before,
          diff: cell.diff,
          pct: cell.pct
        });
      });
    });

    return movers;
  }

  function buildGapRows() {
    var dawonVendor = S.vendors.find(function (vendor) {
      return vendor.id === "dawon";
    });

    var jinwooVendor = S.vendors.find(function (vendor) {
      return vendor.id === "jinwoo";
    });

    if (!dawonVendor || !jinwooVendor) {
      return [];
    }

    var dawonSnap = latestSnap("dawon");
    var jinwooSnap = latestSnap("jinwoo");

    if (!dawonSnap || !jinwooSnap) {
      return [];
    }

    var rows = [];

    dawonSnap.rows.forEach(function (dawonRow) {
      var jinwooRow = jinwooSnap.rows.find(function (row) {
        return modelKey(row.model) === modelKey(dawonRow.model);
      });

      if (!jinwooRow) {
        return;
      }

      dawonVendor.grades.forEach(function (dawonGrade) {
        var normalizedGrade = gradeKey(dawonGrade);

        var jinwooGrade = jinwooVendor.grades.find(function (grade) {
          return gradeKey(grade) === normalizedGrade;
        });

        if (!jinwooGrade) {
          return;
        }

        var dawonPrice = numberValue(
          dawonRow[dawonGrade]
        );

        var jinwooPrice = numberValue(
          jinwooRow[jinwooGrade]
        );

        if (
          dawonPrice === null ||
          jinwooPrice === null
        ) {
          return;
        }

        var gap = dawonPrice - jinwooPrice;

        rows.push({
          model: dawonRow.model,
          grade: dawonGrade,
          dawonPrice: dawonPrice,
          jinwooPrice: jinwooPrice,
          gap: gap,
          winner:
            gap > 0
              ? "다원"
              : gap < 0
                ? "진우"
                : "동일"
        });
      });
    });

    rows.sort(function (a, b) {
      return Math.abs(b.gap) - Math.abs(a.gap);
    });

    return rows;
  }

  function availableModels(vendor) {
    var list = S.snaps[vendor.id] || [];
    var map = {};

    list.forEach(function (snap) {
      snap.rows.forEach(function (row) {
        var key = modelKey(row.model);

        if (key && !map[key]) {
          map[key] = row.model;
        }
      });
    });

    return Object.keys(map)
      .map(function (key) {
        return map[key];
      })
      .sort(function (a, b) {
        return a.localeCompare(b, "ko");
      });
  }

  function trendData(vendor, model, grade) {
    var list = S.snaps[vendor.id] || [];
    var data = [];

    list.forEach(function (snap) {
      var row = snap.rows.find(function (candidate) {
        return modelKey(candidate.model) === modelKey(model);
      });

      if (!row) {
        return;
      }

      var value = numberValue(row[grade]);

      if (value === null) {
        return;
      }

      data.push({
        date: snap.date,
        value: value
      });
    });

    return data;
  }

  function trendSvg(data) {
    if (!data.length) {
      return (
        '<div class="empty">' +
        "선택한 모델과 등급의 저장 이력이 없습니다." +
        "</div>"
      );
    }

    var width = 820;
    var height = 270;

    var left = 58;
    var right = 26;
    var top = 24;
    var bottom = 48;

    var values = data.map(function (item) {
      return item.value;
    });

    var minimum = Math.min.apply(null, values);
    var maximum = Math.max.apply(null, values);

    if (minimum === maximum) {
      minimum = minimum - 1000;
      maximum = maximum + 1000;
    }

    var usableWidth = width - left - right;
    var usableHeight = height - top - bottom;

    function x(index) {
      if (data.length === 1) {
        return left + usableWidth / 2;
      }

      return (
        left +
        index * usableWidth / (data.length - 1)
      );
    }

    function y(value) {
      return (
        top +
        (maximum - value) /
        (maximum - minimum) *
        usableHeight
      );
    }

    var points = data.map(function (item, index) {
      return x(index) + "," + y(item.value);
    }).join(" ");

    var circles = data.map(function (item, index) {
      return (
        '<circle cx="' + x(index) +
        '" cy="' + y(item.value) +
        '" r="5" fill="#c8892a"></circle>' +

        '<text x="' + x(index) +
        '" y="' + (y(item.value) - 11) +
        '" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">' +
        won(item.value) +
        "</text>"
      );
    }).join("");

    var labels = data.map(function (item, index) {
      var show =
        data.length <= 8 ||
        index === 0 ||
        index === data.length - 1 ||
        index % Math.ceil(data.length / 6) === 0;

      if (!show) {
        return "";
      }

      return (
        '<text x="' + x(index) +

  function dashboardComments(
    vendor,
    current,
    previous,
    rows,
    movers,
    gapRows
  ) {
    var comments = [];

    if (!current) {
      comments.push(
        "아직 저장된 단가가 없습니다. 단가 입력 메뉴에서 첫 단가표를 저장해 주세요."
      );

      return comments;
    }

    if (!previous) {
      comments.push(
        "현재 저장된 단가표는 1회입니다. 서로 다른 기준일로 2회 이상 저장하면 상승·하락 분석이 시작됩니다."
      );
    } else {
      var avg = averagePctNumber(rows);

      if (avg > 0) {
        comments.push(
          "이번 " +
          vendor.name +
          " 단가는 직전 저장일 대비 평균 " +
          avg.toFixed(1) +
          "% 상승했습니다."
        );
      } else if (avg < 0) {
        comments.push(
          "이번 " +
          vendor.name +
          " 단가는 직전 저장일 대비 평균 " +
          Math.abs(avg).toFixed(1) +
          "% 하락했습니다."
        );
      } else {
        comments.push(
          "이번 " +
          vendor.name +
          " 전체 평균 단가는 직전 저장일과 동일한 수준입니다."
        );
      }

      var biggestDown = movers
        .filter(function (item) {
          return item.diff < 0;
        })
        .sort(function (a, b) {
          return a.diff - b.diff;
        })[0];

      var biggestUp = movers
        .filter(function (item) {
          return item.diff > 0;
        })
        .sort(function (a, b) {
          return b.diff - a.diff;
        })[0];

      if (biggestDown) {
        comments.push(
          "가장 큰 하락은 " +
          biggestDown.model +
          " " +
          biggestDown.grade +
          "으로, 직전 대비 " +
          won(Math.abs(biggestDown.diff)) +
          "원 하락했습니다."
        );
      }

      if (biggestUp) {
        comments.push(
          "가장 큰 상승은 " +
          biggestUp.model +
          " " +
          biggestUp.grade +
          "으로, 직전 대비 " +
          won(biggestUp.diff) +
          "원 상승했습니다."
        );
      }

      comments.push(
        "상승 " +
        countMoves(rows, "up") +
        "건, 하락 " +
        countMoves(rows, "down") +
        "건, 보합 " +
        countMoves(rows, "flat") +
        "건으로 집계되었습니다."
      );
    }

    if (gapRows.length) {
      var dawonHigh = gapRows.filter(function (row) {
        return row.gap > 0;
      }).length;

      var jinwooHigh = gapRows.filter(function (row) {
        return row.gap < 0;
      }).length;

      var same = gapRows.filter(function (row) {
        return row.gap === 0;
      }).length;

      comments.push(
        "진우아이엔씨와 비교 가능한 항목은 총 " +
        gapRows.length +
        "건이며, 다원이 높은 항목 " +
        dawonHigh +
        "건, 진우가 높은 항목 " +
        jinwooHigh +
        "건, 동일 " +
        same +
        "건입니다."
      );
    } else {
      comments.push(
        "다원과 진우아이엔씨의 동일 모델·동일 등급 데이터가 저장되면 거래처 GAP 분석이 표시됩니다."
      );
    }

    return comments;
  }

              (
                index === S.curIdx
                  ? " selected"
                  : ""
              ) +
              ">" +
                snap.date +
                " (" +
                weekLabel(snap.date) +
                ")" +
              "</option>"
            );
          }).join("") +
        "</select>" +
      "</div>";

    if (previous) {
      var avg = averagePctNumber(rows);

      html +=
        '<div class="dashboard-grid">' +

          metricCard(
            "상승",
            countMoves(rows, "up") + "건",
            "var(--up)",
            ""
          ) +

          metricCard(
            "하락",
            countMoves(rows, "down") + "건",
            "var(--down)",
            ""
          ) +

          metricCard(
            "보합",
            countMoves(rows, "flat") + "건",
            "var(--flat)",
            ""
          ) +

          metricCard(
            "평균 변동률",
            averagePctText(rows) + "%",
            avg > 0
              ? "var(--up)"
              : avg < 0
                ? "var(--down)"
                : "var(--flat)",
            ""
          ) +

        "</div>";
    }

    if (previous && movers.length) {
      html +=
        '<div class="section">' +
          '<div class="section-title" style="margin-bottom:10px">' +
            "📌 3% 이상 주요 변동" +
          "</div>" +

          '<div style="display:flex;flex-wrap:wrap;gap:8px">' +

            movers.slice(0, 15).map(function (item) {
              var color =
                item.diff < 0
                  ? "var(--down)"
                  : "var(--up)";

              return (
                '<div style="' +
                  "border:1.5px solid " + color + ";" +
                  "color:" + color + ";" +
                  "border-radius:8px;" +
                  "padding:6px 10px;" +
                  "font-size:12.5px;" +
                  "background:#fff" +
                '">' +

                  "<b>" +
                    esc(item.model) +
                  "</b> " +

                  esc(item.grade) +
                  " " +

                  (
                    item.diff > 0
                      ? "▲"
                      : "▼"
                  ) +

                  " " +
                  won(Math.abs(item.diff)) +
                  "원 (" +

                  (
                    item.pct > 0
                      ? "+"
                      : ""
                  ) +

                  item.pct.toFixed(1) +
                  "%)" +
                "</div>"
              );
            }).join("") +

          "</div>" +
        "</div>";
    }

    html +=
      '<div class="tblwrap" style="margin-top:20px">' +
        "<table>" +
          "<thead>" +
            "<tr>" +

              '<th style="text-align:left;min-width:140px">' +
                "모델명" +
              "</th>" +

              columns.map(function (grade) {
                return (
                  '<th style="min-width:120px">' +
                    esc(grade) +
                  "</th>"
                );
              }).join("") +

            "</tr>" +
          "</thead>" +

          "<tbody>" +

            rows.map(function (row) {
              return (
                "<tr>" +

                  '<td style="text-align:left;background:#fbfaf7;font-weight:700">' +
                    esc(row.model) +
                  "</td>" +

                  row.grades.map(function (cell) {
                    var detail = "";

                    if (
                      cell.diff !== null &&
                      cell.diff !== 0
                    ) {
                      detail =
                        '<div style="font-size:11px;color:' +
                        (
                          cell.diff < 0
                            ? "var(--down)"
                            : "var(--up)"
                        ) +
                        '">' +

                        (
                          cell.diff < 0
                            ? "▼"
                            : "▲"
                        ) +

                        " " +
                        won(Math.abs(cell.diff)) +

                        (
                          cell.pct !== null
                            ? " (" +
                              (
                                cell.pct > 0
                                  ? "+"
                                  : ""
                              ) +
                              cell.pct.toFixed(1) +
                              "%)"
                            : ""
                        ) +

                        "</div>";
                    } else if (cell.diff === 0) {
                      detail =
                        '<div style="font-size:11px;color:var(--flat)">' +
                          "―" +
                        "</div>";
                    }

                    return (
                      '<td style="text-align:right">' +
                        '<div style="font-weight:700">' +
                          (
                            cell.now === null
                              ? "-"
                              : won(cell.now)
                          ) +
                        "</div>" +

                        detail +
                      "</td>"
                    );
                  }).join("") +

                "</tr>"
              );
            }).join("") +

          "</tbody>" +
        "</table>" +
      "</div>";

    if (previous) {
      var reportLines = [
        "[" + vendor.name + " 주간 단가 보고] " +
          weekLabel(current.date),

        "기준: " +
          previous.date +
          " → " +
          current.date,

        "상승 " +
          countMoves(rows, "up") +
          "건 / 하락 " +
          countMoves(rows, "down") +
          "건 / 보합 " +
          countMoves(rows, "flat") +
          "건",

        "평균 변동률 " +
          averagePctText(rows) +
          "%"
      ];

      if (movers.length) {
        reportLines.push("");
        reportLines.push("주요 변동:");

        movers.slice(0, 8).forEach(function (item) {
          reportLines.push(
            " - " +
            item.model +
            " " +
            item.grade +
            ": " +
            (
              item.diff < 0
                ? "▼"
                : "▲"
            ) +
            won(Math.abs(item.diff)) +
            "원 (" +
            (
              item.pct > 0
                ? "+"
                : ""
            ) +
            item.pct.toFixed(1) +
            "%)"
          );
        });
      }

      html +=
        '<div class="section">' +
          '<div class="section-title" style="margin-bottom:10px">' +
            "📝 보고 문구" +
          "</div>" +

          '<pre id="repText" style="' +
            "background:var(--ink);" +
            "color:#e8e6e0;" +
            "padding:16px;" +
            "border-radius:10px;" +
            "font-size:13px;" +
            "white-space:pre-wrap;" +
            "font-family:monospace;" +
            "line-height:1.7;" +
            "margin:0" +
          '">' +
            esc(reportLines.join("\n")) +
          "</pre>" +

          '<button class="bg" id="copyRep" style="margin-top:8px">' +
            "📋 문구 복사" +
          "</button>" +
        "</div>";
    }

    return html;
  }

  function vendorTab() {
    return (
      stTitle(
        "VENDOR TEMPLATES",
        "거래처 양식 관리",
        "거래처마다 사용하는 등급 칸을 등록할 수 있습니다."
      ) +

      '<div style="display:flex;gap:12px;flex-wrap:wrap;background:#fff;padding:16px;border-radius:10px;border:1px solid var(--line)">' +

        '<div style="flex:1;min-width:180px">' +
          '<label style="display:block;font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:600">' +
            "거래처 이름" +
          "</label>" +

          '<input id="vName" placeholder="예: 새 거래처" ' +
          'style="width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px">' +
        "</div>" +

        '<div style="flex:2;min-width:240px">' +
          '<label style="display:block;font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:600">' +
            "등급 칸, 쉼표로 구분" +
          "</label>" +

          '<input id="vGrades" ' +
          'value="A급, A-급, B+급, B급, 액파, LCD" ' +
          'style="width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px">' +
        "</div>" +

        '<button class="bp" id="vAdd" style="align-self:flex-end;height:40px">' +
          "+ 추가" +
        "</button>" +

      "</div>" +

      '<div style="display:grid;gap:10px;margin-top:20px">' +

        S.vendors.map(function (vendor) {
          return (
            '<div style="display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;gap:12px;flex-wrap:wrap">' +

              "<div>" +
                '<div style="font-weight:700;font-size:15px">' +
                  esc(vendor.name) +
                "</div>" +

                '<div style="font-size:12px;color:var(--sub);margin-top:4px">' +

                  vendor.grades.map(function (grade) {
                    return (
                      '<span style="display:inline-block;background:#efece4;border-radius:5px;padding:2px 8px;margin-right:5px;margin-top:4px;font-size:11.5px">' +
                        esc(grade) +
                      "</span>"
                    );
                  }).join("") +

                "</div>" +
              "</div>" +

              '<div style="display:flex;gap:6px">' +
                '<button class="bgs vPick" data-v="' +
                  vendor.id +
                '">' +
                  "입력하기" +
                "</button>" +

                '<button class="bgs vDel" data-v="' +
                  vendor.id +
                '" style="color:#c0392b;border-color:#e5c4c0">' +
                  "삭제" +
                "</button>" +
              "</div>" +

            "</div>"
          );
        }).join("") +

      "</div>"
    );
  }

  function render() {
    var vendor = S.vendors.find(function (item) {
      return item.id === S.active;
    });

    if (!vendor) {
      S.active = S.vendors[0].id;
      vendor = S.vendors[0];
    }

    A.innerHTML =
      '<header>' +

        "<div>" +
          '<div class="eyebrow">' +
            "DAWON TRADE · WEEKLY PRICE" +
          "</div>" +

          "<h1>주간 단가 보고서</h1>" +
        "</div>" +

        '<div class="tabs">' +

          '<button class="tb ' +
          (
            S.tab === "dashboard"
              ? "on"
              : ""
          ) +
          '" data-tab="dashboard">' +
            "대시보드" +
          "</button>" +

          '<button class="tb ' +
          (
            S.tab === "input"
              ? "on"
              : ""
          ) +
          '" data-tab="input">' +
            "단가 입력" +
          "</button>" +

          '<button class="tb ' +
          (
            S.tab === "report"
              ? "on"
              : ""
          ) +
          '" data-tab="report">' +
            "주간 보고서" +
          "</button>" +

          '<button class="tb ' +
          (
            S.tab === "vendors"
              ? "on"
              : ""
          ) +
          '" data-tab="vendors">' +
            "거래처 양식" +
          "</button>" +

        "</div>" +

      "</header>" +

      '<div class="vbar">' +

        '<span style="font-size:12px;color:var(--sub);margin-right:4px">' +
          "거래처" +
        "</span>" +

        S.vendors.map(function (item) {
          return (
            '<button class="chip ' +
            (
              S.active === item.id
                ? "on"
                : ""
            ) +
            '" data-v="' +
              item.id +
            '">' +
              esc(item.name) +
            "</button>"
          );
        }).join("") +

      "</div>" +

      '<div class="wrap">' +

        (
          S.tab === "dashboard"
            ? dashboardTab(vendor)
            : S.tab === "input"
              ? inputTab(vendor)
              : S.tab === "report"
                ? reportTab(vendor)
                : vendorTab()
        ) +

      "</div>";

    bind();
  }

  function copyText(text) {
    if (
      navigator.clipboard &&
      window.isSecureContext
    ) {
      navigator.clipboard.writeText(text)
        .then(function () {
          toast("복사했습니다.");
        })
        .catch(function () {
          fallbackCopy(text);
        });

      return;
    }

    fallbackCopy(text);
  }

  function fallbackCopy(text) {
    var textarea = document.createElement("textarea");

    textarea.value = text;
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";

    document.body.appendChild(textarea);

    textarea.focus();
    textarea.select();

    try {
      document.execCommand("copy");
      toast("복사했습니다.");
    } catch (error) {
      toast("복사하지 못했습니다.");
    }

    textarea.remove();
  }

  function bind() {
    A.querySelectorAll("[data-tab]")
      .forEach(function (button) {
        button.onclick = function () {
          S.tab = button.getAttribute("data-tab");
          S.curIdx = null;
          render();
        };
      });

    A.querySelectorAll(".chip[data-v]")
      .forEach(function (button) {
        button.onclick = function () {
          S.active = button.getAttribute("data-v");
          S.curIdx = null;
          S.dashModel = "";
          S.dashGrade = "";
          render();
        };
      });

    var vendor = S.vendors.find(function (item) {
      return item.id === S.active;
    });

    if (S.tab === "dashboard") {
      var modelSelect = A.querySelector("#dashModelSel");
      var gradeSelect = A.querySelector("#dashGradeSel");

      if (modelSelect) {
        modelSelect.onchange = function () {
          S.dashModel = modelSelect.value;
          render();
        };
      }

      if (gradeSelect) {
        gradeSelect.onchange = function () {
          S.dashGrade = gradeSelect.value;
          render();
        };
      }
    }

    if (S.tab === "input") {
      var rows = S.draft[vendor.id];

      A.querySelectorAll(".mdl")
        .forEach(function (input) {
          input.oninput = function () {
            var rowIndex = Number(
              input.getAttribute("data-ri")
            );

            rows[rowIndex].model = input.value;
          };
        });

      A.querySelectorAll(".num")
        .forEach(function (input) {
          input.oninput = function () {
            var rowIndex = Number(
              input.getAttribute("data-ri")
            );

            var grade = input.getAttribute("data-g");

            var value = input.value.replace(
              /[^0-9]/g,
              ""
            );

            input.value = value;

            rows[rowIndex][grade] =
              value === ""
                ? ""
                : Number(value);
          };
        });

      A.querySelectorAll(".delRow")
        .forEach(function (button) {
          button.onclick = function () {
            rows.splice(
              Number(button.getAttribute("data-ri")),
              1
            );

            if (!rows.length) {
              rows.push(emptyRow(vendor.grades));
            }

            render();
          };
        });

      var dateInput = A.querySelector("#saveDate");

      if (dateInput) {
        dateInput.onchange = function () {
          S.draftDate[vendor.id] =
            dateInput.value || todayISO();
        };
      }

      var pasteButton = A.querySelector("#pasteBtn");
      var pastePanel = A.querySelector("#pastePanel");

      if (pasteButton && pastePanel) {
        pasteButton.onclick = function () {
          pastePanel.style.display =
            pastePanel.style.display === "none"
              ? "block"
              : "none";
        };
      }

      var pasteCancel = A.querySelector("#pasteCancel");

      if (pasteCancel) {
        pasteCancel.onclick = function () {
          pastePanel.style.display = "none";
        };
      }

      var pasteGo = A.querySelector("#pasteGo");

      if (pasteGo) {
        pasteGo.onclick = function () {
          var text = A.querySelector("#pasteTxt")
            .value
            .trim();

          if (!text) {
            toast("붙여넣을 내용을 입력해 주세요.");
            return;
          }

          var lines = text
            .split("\n")
            .filter(function (line) {
              return line.trim();
            });

          var parsed = lines.map(function (line) {
            var parts = line
              .split(/\t|,|\s{2,}/)
              .map(function (part) {
                return part.trim();
              })
              .filter(Boolean);

            if (parts.length < 2) {
              parts = line.split(/\s+/);
            }

            var row = emptyRow(vendor.grades);

            row.model = parts[0] || "";

            vendor.grades.forEach(function (grade, index) {
              var raw = String(
                parts[index + 1] || ""
              ).replace(/[^0-9]/g, "");

              row[grade] =
                raw
                  ? Number(raw)
                  : "";
            });

            return row;
          });

          if (parsed.length) {
            S.draft[vendor.id] = parsed;

            toast(
              parsed.length +
              "행을 불러왔습니다. 숫자를 확인해 주세요."
            );

            render();
          }
        };
      }

      var addRowButton = A.querySelector("#addRow");

      if (addRowButton) {
        addRowButton.onclick = function () {
          rows.push(emptyRow(vendor.grades));
          render();
        };
      }

      var clearButton = A.querySelector("#clearRows");

      if (clearButton) {
        clearButton.onclick = function () {
          var confirmed = confirm(
            "현재 입력된 내용을 모두 지울까요?"
          );

          if (!confirmed) {
            return;
          }

          S.draft[vendor.id] = [
            emptyRow(vendor.grades)
          ];

          render();
        };
      }

      var saveButton = A.querySelector("#saveBtn");

      if (saveButton) {
        saveButton.onclick = function () {
          var cleanRows = rows.filter(function (row) {
            return String(row.model || "").trim();
          });

          if (!cleanRows.length) {
            toast("저장할 데이터가 없습니다.");
            return;
          }

          var selectedDate =
            S.draftDate[vendor.id] ||
            todayISO();

          var snapshot = {
            date: selectedDate,

            rows: cleanRows.map(function (row) {
              return Object.assign({}, row);
            })
          };

          var list = (
            S.snaps[vendor.id] || []
          ).slice();

          var existingIndex = list.findIndex(function (snap) {
            return snap.date === snapshot.date;
          });

          if (existingIndex >= 0) {
            var overwrite = confirm(
              selectedDate +
              " 자료가 이미 있습니다.\n기존 자료를 덮어쓸까요?"
            );

            if (!overwrite) {
              return;
            }

            list[existingIndex] = snapshot;
          } else {
            list.push(snapshot);
          }

          list.sort(function (a, b) {
            return a.date.localeCompare(b.date);
          });

          S.snaps[vendor.id] = list;

          save();

          toast(
            selectedDate +
            " 단가 저장 완료!"
          );
        };
      }
    }

    if (S.tab === "report") {
      var weekSelect = A.querySelector("#weekSel");

      if (weekSelect) {
        weekSelect.onchange = function () {
          S.curIdx = Number(weekSelect.value);
          render();
        };
      }

      var copyButton = A.querySelector("#copyRep");

      if (copyButton) {
        copyButton.onclick = function () {
          var reportText = A.querySelector("#repText");

          if (reportText) {
            copyText(reportText.textContent);
          }
        };
      }
    }

    if (S.tab === "vendors") {
      var vendorAdd = A.querySelector("#vAdd");

      if (vendorAdd) {
        vendorAdd.onclick = function () {
          var name = A.querySelector("#vName")
            .value
            .trim();

          var gradeText = A.querySelector("#vGrades")
            .value;

          if (!name) {
            toast("거래처 이름을 입력하세요.");
            return;
          }

          var grades = gradeText
            .split(",")
            .map(function (grade) {
              return grade.trim();
            })
            .filter(Boolean);

          if (!grades.length) {
            toast("등급을 입력하세요.");
            return;
          }

          S.vendors.push({
            id: "v" + Date.now(),
            name: name,
            grades: grades
          });

          save();

          toast(
            "'" +
            name +
            "' 거래처를 추가했습니다."
          );

          render();
        };
      }

      A.querySelectorAll(".vPick")
        .forEach(function (button) {
          button.onclick = function () {
            S.active = button.getAttribute("data-v");
            S.tab = "input";
            render();
          };
        });

      A.querySelectorAll(".vDel")
        .forEach(function (button) {
          button.onclick = function () {
            if (S.vendors.length <= 1) {
              toast("최소 1개의 거래처가 필요합니다.");
              return;
            }

            var id = button.getAttribute("data-v");

            var target = S.vendors.find(function (item) {
              return item.id === id;
            });

            var confirmed = confirm(
              "'" +
              (
                target
                  ? target.name
                  : "선택 거래처"
              ) +
              "' 양식을 삭제할까요?\n저장된 단가 데이터는 남아 있습니다."
            );

            if (!confirmed) {
              return;
            }

            S.vendors = S.vendors.filter(function (item) {
              return item.id !== id;
            });

            if (S.active === id) {
              S.active = S.vendors[0].id;
            }

            save();
            render();
          };
        });
    }
  }

  render();
})();
</script>

</body>
</html>
