<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다원트레이드 단가 보고서</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
      background: #f7f5f0; color: #14202e; line-height: 1.6;
    }
    header {
      background: #14202e; color: #fff; padding: 40px 20px; text-align: center;
    }
    .eyebrow { font-size: 12px; letter-spacing: 3px; color: #c8892a; font-weight: 600; }
    header h1 { font-size: 28px; margin-top: 8px; }
    .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    .card {
      background: #fff; border: 1px solid #dcd6ca; border-radius: 12px;
      padding: 30px; margin-bottom: 20px;
    }
    .card h2 { font-size: 20px; margin-bottom: 12px; color: #14202e; }
    .card p { color: #6b6558; font-size: 15px; }
    .badge {
      display: inline-block; background: #c8892a; color: #fff;
      padding: 4px 12px; border-radius: 20px; font-size: 13px; margin-top: 16px;
    }
    footer { text-align: center; color: #8a8375; font-size: 13px; padding: 30px; }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">DAWON TRADE</div>
    <h1>중고폰 단가 보고서 시스템</h1>
  </header>
  <div class="container">
    <div class="card">
      <h2>👋 웹사이트가 성공적으로 열렸습니다!</h2>
      <p>축하합니다. 첫 웹사이트가 인터넷에 올라갔습니다. 이제 여기에 단가 입력, 주간 비교, 보고서 생성 기능을 하나씩 추가해 나갈 수 있습니다.</p>
      <span class="badge">1단계 완료 · 웹사이트 배포 성공</span>
    </div>
    <div class="card">
      <h2>📋 앞으로 추가할 기능</h2>
      <p>· 거래처별 단가표 입력<br>· 지난주 대비 등락 자동 비교<br>· 주간 보고서 자동 생성<br>· (나중에) 사진 자동 인식</p>
    </div>
  </div>
  <footer>다원트레이드 · Dawon Trade</footer>
</body>
</html>
